[package]
name = "phoebo-desktop-pet"
version = "0.1.0"
description = "A lightweight local-only Phoebo desktop pet"
authors = ["Phoebo Desktop Pet Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "phoebo_desktop_pet_lib"

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
tauri = { version = "~2.11.5", features = ["tray-icon"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
